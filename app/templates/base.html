<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eaf6e9; }
        .up-village-scene {
            position: relative; isolation: isolate; overflow: hidden; min-height: calc(100vh - 75px);
            display: flex; align-items: center; justify-content: center; padding: 40px 15px;
            background: linear-gradient(180deg, #8dd7f4 0%, #e3f7fa 45%, #bce5a0 72%, #5aab49 100%);
        }
        .sun { position: absolute; right: 10%; top: 50px; height: 85px; width: 85px; background: #ffe38a; border-radius: 50%; box-shadow: 0 0 45px rgba(255,225,125,.8); animation: sunGlow 4s infinite alternate; z-index: -1; }
        .cloud { position: absolute; width: 105px; height: 32px; background: white; border-radius: 30px; animation: cloudMove 12s infinite alternate; z-index: -1; }
        .cloud::before, .cloud::after { content: ""; position: absolute; background: white; border-radius: 50%; }
        .cloud::before { width: 42px; height: 42px; top: -20px; left: 15px; }
        .cloud::after { width: 52px; height: 52px; top: -28px; right: 12px; }
        .cloud-one { left: 8%; top: 70px; } .cloud-two { left: 50%; top: 140px; transform: scale(.7); }
        @keyframes cloudMove { to { translate: 35px 0; } } @keyframes sunGlow { to { transform: scale(1.08); } }
        .hill { position: absolute; bottom: 100px; width: 75%; height: 230px; border-radius: 50% 50% 0 0; background: #8dce70; z-index: -1; }
        .hill-left { left: -25%; } .hill-right { right: -25%; height: 275px; background: #65b855; }
        .field { position: absolute; bottom: 0; left: 0; height: 150px; width: 100%; background: linear-gradient(#64b74b, #347c33); z-index: -1; }
        .hut { position: absolute; bottom: 120px; left: 5%; width: 100px; height: 78px; background: #dfb47a; border: 3px solid #a16c41; z-index: -1; }
        .hut::before { content: ""; position: absolute; top: -47px; left: -17px; width: 128px; height: 58px; background: #a95031; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
        .door { position: absolute; bottom: 0; left: 33px; width: 29px; height: 43px; background: #704326; border-radius: 10px 10px 0 0; }
        .tree { position: absolute; bottom: 120px; right: 6%; height: 90px; width: 20px; background: #80512d; z-index: -1; }
        .tree::before { content: ""; position: absolute; top: -60px; left: -37px; width: 95px; height: 90px; border-radius: 50%; background: #24813b; box-shadow: -22px 18px #359749, 20px 18px #197234; }
        .app-card { width: 100%; max-width: 850px; padding: 35px; background: rgba(255, 255, 255, .96); border-radius: 24px; box-shadow: 0 20px 60px rgba(26,77,36,.2); z-index: 2; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-success" href="{% url 'home' %}">🌾 Crop Recommendation (UP Village Theme)</a>
        <div class="navbar-nav ms-auto gap-2">
            <a class="nav-link" href="{% url 'home' %}">Home</a>
            <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link btn btn-success text-white px-3" href="{% url 'crop_recommendation' %}">Predict Crop</a>
            <a class="nav-link" href="{% url 'prediction_history' %}">History</a>
        </div>
    </div>
</nav>
{% block content %}{% endblock %}
</body>
</html>
