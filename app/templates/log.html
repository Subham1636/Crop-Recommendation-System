
{% extends 'base.html' %}

{% block content %}
<style>
    .auth-card {
        max-width: 460px;
        margin: auto;
        background: rgba(255,255,255,.97);
        padding: 35px;
        border-radius: 22px;
        box-shadow: 0 15px 45px rgba(26,77,36,.18);
    }
    .auth-card h2 { color: #18783a; font-weight: 800; }
    .auth-card .form-control {
        padding: 12px;
        border-radius: 10px;
    }
    .auth-card .form-control:focus {
        border-color: #18783a;
        box-shadow: 0 0 0 .2rem rgba(24,120,58,.12);
    }
    .auth-btn {
        background: #18783a;
        color: white;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        width: 100%;
    }
    .auth-btn:hover { background: #104d2c; color: white; }
</style>

<main class="up-village-scene">
    <div class="sun"></div>
    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>
    <div class="hill hill-left"></div>
    <div class="hill hill-right"></div>
    <div class="hut"><div class="door"></div></div>
    <div class="tree"></div>
    <div class="field"></div>

    <div class="container position-relative" style="z-index:2;">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="display-4">🌾</div>
                <h2>Welcome Back!</h2>
                <p class="text-muted small">Login to your Crop Recommendation System</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control"
                           placeholder="Enter your email" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn auth-btn">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </form>

            <p class="text-center mt-4 mb-0 small">
                Don't have an account?
                <a href="{% url 'register' %}" class="text-success fw-bold">Register Now</a>
            </p>
        </div>
    </div>
</main>
{% endblock %}
